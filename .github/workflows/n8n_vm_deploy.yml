name: Deploy n8n Stack to Azure VM

on:
  push:
    branches:
      - main
    paths:
      - n8n/**
      - .github/workflows/n8n_vm_deploy.yml
  workflow_dispatch:
    # Allows manual trigger from GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./n8n

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: remove existing file
        run: |
          ssh -i ${{ secrets.SSH_PRIVATE_KEY }} -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "rm -f /home/olu/n8n/docker-compose.yml"

      # Step 1: Copy docker-compose.yml from repository to Azure VM
      - name: Copy docker-compose.yml to VM
        #uses: appleboy/scp-action@v0.1.7
        run: |
          scp -i ${{ secrets.SSH_PRIVATE_KEY }} -o StrictHostKeyChecking=no docker-compose.yml ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/olu/n8n/
        # with:
        #   host: ${{ secrets.SERVER_HOST }} # Your VM Public IP or DNS
        #   username: ${{ secrets.SERVER_USER }} # olu
        #   key: ${{ secrets.SSH_PRIVATE_KEY }} # Private key content
        #   source: "docker-compose.yml"
        #   target: "/home/olu/n8n/"

      # Step 2: Write secrets and restart stack via SSH
      - name: Deploy Stack via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Navigate to project folder
            cd ~/n8n

            # Write secrets to .env file
            echo "NGROK_AUTHTOKEN=${{ secrets.NGROK_AUTHTOKEN }}" > .env
            chmod 600 .env

            # Pull images and recreate containers using Compose v2
            docker compose pull
            docker compose up -d --remove-orphans
